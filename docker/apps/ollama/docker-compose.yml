services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - /opt/data-docker/ollama/data:/root/.ollama
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 11434:11434
    environment:
      - TZ=America/Montreal
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=*
      - NVIDIA_VISIBLE_DEVICES=all
      - OLLAMA_FLASH_ATTENTION=1

      # Strict 16GB VRAM Optimization Guards
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_NUM_PARALLEL=2        # 2 suffisent (pas 4) car IQ3_XXS est plus gourmand
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_KV_CACHE_TYPE=q8_0      # Excellent choice - saves precious VRAM context space
    restart: unless-stopped
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    networks:
      - ai_network


  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    volumes:
      - /opt/data-docker/ollama/web-ui/data:/app/backend/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 3000:8080
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - ENABLE_SIGNUP=${WEBUI_ENABLE_SIGNUP}
      - SCARF_ANALYTICS=false
      - TZ=America/Montreal

      # Offload RAG Embeddings cleanly to your GPU via Ollama
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_BASE_URL=http://ollama:11434
      - RAG_EMBEDDING_MODEL=nomic-embed-text:latest

      # Advanced GPU Reranking (Executes locally inside WebUI container via HuggingFace transformers)
      - RAG_RERANKING_ENGINE=transformers
      - RAG_RERANKING_MODEL=hf.co/l-nmch/bge-reranker-v2-m3-Q8_0-GGUF:Q8_0
      - RAG_TOP_K=10                   # Reduced from 15 to lower token injection load on your 16GB ceiling
      - RAG_CHUNK_SIZE=1024

      # Interface Customization
      - WEBUI_NAME=Local Architect Brain
      - ENABLE_RAG_WEB_SEARCH=true
      - ENABLE_IMAGE_GENERATION=false  # Disabled to save system overhead
      - ENABLE_COMMUNITY_MODEL_SHARING=false
      - ENABLE_MODEL_FILTER=true
      - ENABLE_OPENAPI=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - ai_network

networks:
  ai_network:
    driver: bridge
