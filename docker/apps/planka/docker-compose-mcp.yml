name: planka-mcp-server
services:
  planka-mcp-server:
    image: denisix/planka-mcp:latest
    container_name: planka-v2-mcp
    hostname: planka-mcp
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - MCP_TRANSPORT=sse
      - PORT=3000
      - PLANKA_BASE_URL=${PLANKA_BASE_URL}
      - PLANKA_USERNAME=${PLANKA_AGENT_EMAIL}
      - PLANKA_PASSWORD=${PLANKA_AGENT_PASSWORD}
      - MCP_TRANSPORT=sse
      - MCP_HOST=0.0.0.0
      - MCP_AUTH_TOKEN=change-me