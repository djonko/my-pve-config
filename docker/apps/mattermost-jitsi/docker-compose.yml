# Mattermost + Jitsi (JWT-locked) with external reverse-proxy routing.
# - No Traefik labels here: routing is defined centrally in the home-traefik repo
#   (chat.* -> :8065, meet.* -> :8080).
# - Runtime env values live ONLY in /opt/data-etc/mattermost-jitsi/config.env
#   (symlinked as .env in the stack dir so docker compose can interpolate them).
name: mattermost-jitsi

services:
  mm-db:
    image: postgres:17-alpine
    container_name: mm-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${MM_DB_USER}
      POSTGRES_PASSWORD: ${MM_DB_PASSWORD}
      POSTGRES_DB: ${MM_DB_NAME}
    volumes:
      - /opt/data-docker/mattermost-jitsi/postgres:/var/lib/postgresql/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - internal

  mm-app:
    image: mattermost/mattermost-team-edition:12.0.1
    container_name: mm-app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MM_USERNAME: sysadmin
      MM_PASSWORD: ${MM_SERVICE_PASSWORD}
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: "postgres://${MM_DB_USER}:${MM_DB_PASSWORD}@mm-db:5432/${MM_DB_NAME}?sslmode=disable&connect_timeout=10"
      # --- SMTP (Gmail) ---
      # Requires a Google App Password (account with 2-Step Verification enabled)
      MM_EMAILSETTINGS_SMTPSERVER: ${SMTP_SERVER}
      MM_EMAILSETTINGS_SMTPPORT: ${SMTP_PORT}
      MM_EMAILSETTINGS_CONNECTIONSECURITY: ${SMTP_CONNECTION_SECURITY}
      MM_EMAILSETTINGS_SMTPUSERNAME: ${SMTP_USER_NAME}
      MM_EMAILSETTINGS_SMTPPASSWORD: ${SMTP_PASSWORD}
      MM_EMAILSETTINGS_FEEDBACKEMAIL: ${SMTP_SENDER_ADDRESS}
      MM_EMAILSETTINGS_REPLYTOADDRESS: ${SMTP_SENDER_ADDRESS}
      MM_EMAILSETTINGS_NOTIFICATIONSDISPLAYNAME: ${SMTP_SENDER_NAME}
      MM_EMAILSETTINGS_ENABLESMTPAUTH: "true"
      MM_SERVICESETTINGS_SITEURL: https://${DOMAIN_MM}/
      MM_SERVICESETTINGS_ENABLEMOBILESERVER: "true"
      MM_SERVICESETTINGS_ENABLELINKMETHOD: "true"
      MM_PLUGINSETTINGS_ENABLEUPLOADS: "true"
      MM_SERVICESETTINGS_ALLOWSAVEEMAILPREFERENCES: "true"
    volumes:
      - /opt/data-docker/mattermost-jitsi/mattermost/data:/mattermost/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "8065:8065"
    depends_on:
      mm-db:
        condition: service_healthy
    networks:
      - internal

  prosody:
    image: jitsi/prosody:stable
    container_name: jitsi-prosody
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      XMPP_SERVER: prosody
      ENABLE_AUTH: "1"
      AUTH_TYPE: jwt
      JWT_APP_ID: ${JWT_APP_ID}
      JWT_APP_SECRET: ${JITSI_JWT_SECRET}
      JWT_ACCEPTED_ISSUERS: mattermost
      JWT_ACCEPTED_AUDIENCES: jitsi
      PROSODY_BASE_URL: https://${DOMAIN_JITSI}/
      JICOFO_AUTH_PASSWORD: ${JICOFO_AUTH_PASSWORD}
      JVB_AUTH_PASSWORD: ${JVB_AUTH_PASSWORD}
    volumes:
      - /opt/data-docker/mattermost-jitsi/jitsi/prosody:/config
    networks:
      - internal

  jicofo:
    image: jitsi/jicofo:stable
    container_name: jitsi-jicofo
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      XMPP_SERVER: prosody
      JICOFO_AUTH_USER: focus
      JICOFO_AUTH_PASSWORD: ${JICOFO_AUTH_PASSWORD}
    volumes:
      - /opt/data-docker/mattermost-jitsi/jitsi/jicofo:/config
    depends_on:
      - prosody
    networks:
      - internal

  jvb:
    image: jitsi/jvb:stable
    container_name: jitsi-jvb
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      XMPP_SERVER: prosody
      JVB_AUTH_USER: jvb
      JVB_AUTH_PASSWORD: ${JVB_AUTH_PASSWORD}
      JVB_ADVERTISE_IPS: ${PUBLIC_SERVER_IP}
      JVB_ADVERTISE_URLS: https://${DOMAIN_JITSI}:443
      JVB_PORT: 10000
      JVB_TCP_PORT: 4443
      JVB_TCP_MAPPED_PORT: 4443
    volumes:
      - /opt/data-docker/mattermost-jitsi/jitsi/jvb:/config
    ports:
      - "10000:10000/udp"
      - "4443:4443"
    depends_on:
      - prosody
    networks:
      - internal

  jitsi-web:
    image: jitsi/web:stable
    container_name: jitsi-web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      XMPP_SERVER: prosody
      ENABLE_AUTH: "1"
      AUTH_TYPE: jwt
      JWT_APP_ID: ${JWT_APP_ID}
      JWT_APP_SECRET: ${JITSI_JWT_SECRET}
      PUBLIC_URL: https://${DOMAIN_JITSI}/
    volumes:
      - /opt/data-docker/mattermost-jitsi/jitsi/web:/config
    ports:
      - "8080:80"
    depends_on:
      - prosody
    networks:
      - internal

networks:
  internal:
    driver: bridge
