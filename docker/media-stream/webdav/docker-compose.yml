name: webdav2
services:
  micromata-webdav:
    image: micromata/dave:latest
    container_name: data-webdav2
    restart: unless-stopped
    user: 1000:1000
    security_opt:
      - no-new-privileges:true
    ports:
      - "8101:8000"
    volumes:
      - "/nfs/stream_data/audios:/home/webdav/music:ro"
      - "/opt/data-docker/media_stream/micromata-webdave/config.yaml:/config.yaml:ro"
    environment:
      - TZ=America/Toronto
    labels:
      - "com.centurylinklabs.watchtower.scope=toUpdateScope"

